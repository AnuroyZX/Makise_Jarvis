[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-kurisu"
version = "1.0.0"
description = "Amadeus Kurisu (Steins;Gate / Jarvis style AI Assistant) in 9 ultra-lightweight modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "websockets>=12.0",
    "edge-tts>=6.1.12",
    "Pillow>=10.0.0",
    "mss>=9.0.0",
]

[project.optional-dependencies]
desktop = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "keyboard>=0.13.5",
    "edge-tts>=6.1.12",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
