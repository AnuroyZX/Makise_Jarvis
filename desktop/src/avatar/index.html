<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file: http://127.0.0.1:* ws://127.0.0.1:* https://cdn.jsdelivr.net; img-src 'self' data: blob: http://127.0.0.1:*; media-src 'self' blob: data: http://127.0.0.1:*; connect-src 'self' file: http://127.0.0.1:* ws://127.0.0.1:* https://cdn.jsdelivr.net blob:;">
<title>Amadeus Avatar Overlay</title>
<style>
  :root {
    --sky-50: #f2f9ff;
    --sky-100: #e3f2ff;
    --sky-200: #c7e5ff;
    --sky-400: #7cc4fa;
    --sky-600: #2f8fdc;
    --ink: #122840;
    --glass: rgba(232, 246, 255, 0.78);
    --glass-edge: rgba(255, 255, 255, 0.92);
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  /* Dedicated 3D Stage on the right side so lateral dialogues NEVER cover Kurisu */
  #stageCanvas {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 350px; height: 100%;
    pointer-events: none;
  }
  /* Windows 7 Aero Gloss + Soft Air Light-Blue Glass Card */
  .aero-glass {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.86) 0%, var(--glass) 50%, rgba(186,226,255,0.72) 100%);
    border: 1.5px solid var(--glass-edge);
    border-radius: 13px;
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(47, 143, 220, 0.22), inset 0 1px 1px rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px) saturate(145%);
  }
  /* Lateral Dynamic Dialogue Stream (Left Column) */
  #sideDialogStream {
    position: absolute;
    top: 36px;
    left: 10px;
    width: 226px;
    bottom: 112px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    z-index: 20;
    pointer-events: none;
  }
  .side-bubble {
    padding: 9px 12px;
    font-size: 0.82rem;
    line-height: 1.38;
    border-top-right-radius: 4px;
    opacity: 0;
    transform: translateX(-14px) scale(0.96);
    transition: opacity 0.28s ease, transform 0.28s ease;
    pointer-events: auto;
    user-select: text;
    word-wrap: break-word;
  }
  .side-bubble.visible {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  .side-bubble.exiting {
    opacity: 0;
    transform: translateX(-16px) scale(0.92);
  }
  .typing-cursor {
    display: inline-block;
    color: var(--sky-600);
    font-weight: 700;
    animation: blinkCursor 0.6s infinite;
  }
  @keyframes blinkCursor {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  #confirmCard {
    position: absolute;
    bottom: 110px;
    left: 14px;
    width: 260px;
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    z-index: 32;
    pointer-events: auto;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(251, 191, 36, 0.45);
    animation: fadeInScale 0.22s ease forwards;
  }
  .confirm-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fbbf24;
    margin-bottom: 6px;
  }
  .confirm-text {
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .btn-confirm-run {
    background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.7);
    padding: 5px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .btn-confirm-cancel {
    background: rgba(100, 116, 139, 0.75);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35);
    padding: 5px 10px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.75rem;
    cursor: pointer;
  }
  #quickInputBar {
    position: absolute; bottom: 54px; left: 16px; right: 16px;
    padding: 7px 10px; display: none; gap: 6px; align-items: center; z-index: 25;
  }
  #miniDock {
    position: absolute; bottom: 10px; right: 16px;
    display: flex; gap: 6px; padding: 6px 10px; z-index: 22;
    white-space: nowrap; align-items: center;
  }
  .btn-drag {
    cursor: grab;
    background: rgba(255, 255, 255, 0.88);
    color: var(--sky-600);
    border: 1px solid var(--sky-400);
    padding: 6px 9px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.78rem;
  }
  .btn-drag:active {
    cursor: grabbing;
  }
  #miniDock button {
    -webkit-app-region: no-drag;
  }
  #quickInput {
    flex: 1; border: 1px solid rgba(47,143,220,0.45);
    background: rgba(255,255,255,0.9); color: var(--ink);
    padding: 7px 10px; border-radius: 8px; outline: none; font-size: 0.84rem;
  }
  .btn-air {
    background: linear-gradient(180deg, #6ec3ff 0%, #2f8fdc 100%);
    color: #fff; border: 1px solid rgba(255,255,255,0.85);
    padding: 6px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.78rem;
  }
  #statePill {
    position: absolute; top: 12px; left: 12px;
    padding: 4px 10px; font-size: 0.74rem; font-weight: 600;
    display: none; z-index: 25;
  }
  .btn-air-sm {
    background: linear-gradient(180deg, #6ec3ff 0%, #2f8fdc 100%);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.7);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.72rem;
  }
  .btn-air-sm.btn-close {
    background: rgba(239, 68, 68, 0.8);
    border-color: rgba(255, 255, 255, 0.5);
  }
  .btn-air-sm.btn-close:hover {
    background: rgba(220, 38, 38, 0.95);
  }
</style>

<body>
  <!-- Lateral Real-Time Typewriter & Self-Erasing Dialogue Stream -->
  <div id="sideDialogStream"></div>

  <!-- Right-side Unobstructed 3D VRM Stage -->
  <div id="stageCanvas"></div>

  <!-- File Operation / Script Execution Confirmation Card -->
  <div id="confirmCard" class="aero-glass">
    <div class="confirm-header">⚡ Solicitud de Acción</div>
    <div id="confirmText" class="confirm-text"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn-confirm-run" onclick="sendConfirm(true)">▶ Autorizar</button>
      <button class="btn-confirm-cancel" onclick="sendConfirm(false)">✕ Cancelar</button>
    </div>
  </div>

  <!-- Listening / Thinking Pill -->
  <div id="statePill" class="aero-glass">🎙️ Escuchando...</div>

  <!-- Floating Quick Input Bar (Ctrl+Alt+Space) -->
  <div id="quickInputBar" class="aero-glass">
    <input id="quickInput" placeholder="Habla con Kurisu (Enter para enviar, Esc para ocultar)...">
    <button class="btn-air" onclick="submitQuickInput()">Enviar</button>
  </div>

  <!-- Soft Air Mini-Dock under Kurisu -->
  <div id="miniDock" class="aero-glass">
    <span id="dragPill" class="btn-drag" onmousedown="startAvatarDrag(event)" title="Arrastra aquí para mover a Kurisu">✥ Mover</span>
    <button id="micBtn" class="btn-air" onclick="toggleVoiceMic()" title="Hablar por micrófono">🎙️ Micro</button>
    <button class="btn-air" onclick="toggleQuickBar()" title="Ctrl+Alt+Espacio">💬 Hablar</button>
    <button class="btn-air" onclick="triggerNotesWindow()" title="Ver Notas / Detalle en Pantalla">📝 Notas</button>
    <button class="btn-air" onclick="triggerScreenLook()" title="Ctrl+Alt+V">👁️ Pantalla</button>
    <button class="btn-air" onclick="openPanelWindow()" title="Abrir Ventana Soft Air">⚙️ Panel</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';

let currentVrm = null;
let mixer = null;
let currentEmotion = 'neutral';
let currentGesture = 'idle';
let gestureTimer = 0;
let activeCustomPose = null;
let customPoseTimer = 0;
let bubblesMode = 'all';
let ws = null;
let httpUrl = '';
let pendingOpId = '';

// Open-LLM-VTuber Sequential Sentence Audio Queue + WebAudio DSP Filter Chain + Lip-Sync
const audioQueue = [];
let isPlayingQueue = false;
let audioCtx = null;
let analyser = null;
let highpassNode = null;
let presenceNode = null;
let delayNode = null;
let delayGainNode = null;
let masterGainNode = null;
let compressorNode = null;
let freqData = null;
let currentDspPreset = 'amadeus_screen';
const audioEl = new Audio();
audioEl.volume = 0.65;

function ensureAudioGraph() {
  if (audioCtx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    freqData = new Uint8Array(analyser.frequencyBinCount);

    highpassNode = audioCtx.createBiquadFilter();
    presenceNode = audioCtx.createBiquadFilter();
    delayNode = audioCtx.createDelay(0.5);
    delayGainNode = audioCtx.createGain();

    masterGainNode = audioCtx.createGain();
    masterGainNode.gain.value = 0.70; // Smooth non-blasting volume ceiling

    compressorNode = audioCtx.createDynamicsCompressor();
    compressorNode.threshold.value = -16;
    compressorNode.knee.value = 8;
    compressorNode.ratio.value = 3.5;
    compressorNode.attack.value = 0.003;
    compressorNode.release.value = 0.1;

    const mediaSource = audioCtx.createMediaElementSource(audioEl);
    mediaSource.connect(highpassNode);
    highpassNode.connect(presenceNode);
    presenceNode.connect(analyser);

    // Parallel short metallic/ethereal delay path (for Fi / Amadeus effect)
    presenceNode.connect(delayNode);
    delayNode.connect(delayGainNode);
    delayGainNode.connect(analyser);

    analyser.connect(compressorNode);
    compressorNode.connect(masterGainNode);
    masterGainNode.connect(audioCtx.destination);
    applyAudioDspPreset(currentDspPreset);
  } catch (e) {
    console.warn("WebAudio fallback mode:", e);
  }
}

function applyAudioDspPreset(preset) {
  currentDspPreset = preset || 'amadeus_screen';
  if (!audioCtx || !highpassNode || !presenceNode || !delayNode || !delayGainNode) return;

  if (currentDspPreset === 'amadeus_screen') {
    // Steins;Gate 0 Amadeus Digital Monitor EQ (subtle highpass + 3.2kHz digital presence)
    highpassNode.type = 'highpass';
    highpassNode.frequency.value = 185;
    presenceNode.type = 'peaking';
    presenceNode.frequency.value = 3200;
    presenceNode.Q.value = 1.1;
    presenceNode.gain.value = 2.6;
    delayNode.delayTime.value = 0.012;
    delayGainNode.gain.value = 0.08;
  } else if (currentDspPreset === 'fi_spirit') {
    // Fi (Zelda Skyward Sword) Ethereal / Harmonic Chime Filter (0 MB VRAM)
    highpassNode.type = 'highpass';
    highpassNode.frequency.value = 260;
    presenceNode.type = 'peaking';
    presenceNode.frequency.value = 2800;
    presenceNode.Q.value = 2.2;
    presenceNode.gain.value = 4.5;
    delayNode.delayTime.value = 0.022;
    delayGainNode.gain.value = 0.28;
  } else if (currentDspPreset === 'phone') {
    highpassNode.type = 'highpass';
    highpassNode.frequency.value = 380;
    presenceNode.type = 'lowpass';
    presenceNode.frequency.value = 3400;
    delayGainNode.gain.value = 0.0;
  } else {
    // 'clean': Studio bypass
    highpassNode.type = 'highpass';
    highpassNode.frequency.value = 20;
    presenceNode.type = 'peaking';
    presenceNode.gain.value = 0.0;
    delayGainNode.gain.value = 0.0;
  }
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('quickInputBar').style.display = 'none';
  }
});

// 3D Transparent Stage (Right 350px column)
const container = document.getElementById('stageCanvas');
const stageW = 350;
const stageH = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(stageW, stageH);
renderer.setPixelRatio(1.0);
container.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(28.0, stageW / stageH, 0.1, 20.0);
camera.position.set(0.0, 1.32, 1.65);
camera.lookAt(0.0, 1.28, 0.0);

const scene = new THREE.Scene();
const dirLight = new THREE.DirectionalLight(0xffffff, Math.PI * 0.95);
dirLight.position.set(1.2, 2.2, 2.0);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xdbeafe, 1.35));

// Gaze Tracking & Saccades Target Object
const lookAtTarget = new THREE.Object3D();
lookAtTarget.position.set(0.0, 1.32, 1.62);
scene.add(lookAtTarget);

let mouseNormX = 0;
let mouseNormY = 0;
window.addEventListener('mousemove', (e) => {
  mouseNormX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNormY = -(e.clientY / window.innerHeight) * 2 + 1;
});

let nextSaccadeTime = 1.0;
const saccadeOffset = new THREE.Vector3(0, 0, 0);

// Continuous Smooth Emotion Weights (LERP)
const emotionWeights = {
  neutral: 1.0,
  happy: 0.0,
  angry: 0.0,
  sad: 0.0,
  relaxed: 0.0,
  surprised: 0.0,
};
const targetEmotionWeights = {
  neutral: 1.0,
  happy: 0.0,
  angry: 0.0,
  sad: 0.0,
  relaxed: 0.0,
  surprised: 0.0,
};

// Gesture Blending & Inertia
let gestureBlend = 0.0;

// Formant Viseme Attack & Release States
const currentVisemes = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
const targetVisemes = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

function loadVrmModel(url) {
  console.log("Loading VRM from:", url);
  loader.load(
    url,
    (gltf) => {
      const vrm = gltf.userData.vrm;
      console.log("VRM loaded! metaVersion:", vrm?.meta?.metaVersion);
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      if (currentVrm) {
        scene.remove(currentVrm.scene);
        VRMUtils.deepDispose(currentVrm.scene);
      }
      currentVrm = vrm;
      VRMUtils.rotateVRM0(vrm);
      scene.add(vrm.scene);
      const box = new THREE.Box3().setFromObject(vrm.scene);
      const height = Math.max(1.2, box.max.y - box.min.y);
      // Full head + upper body framing with zero obstruction above her head
      camera.position.set(0.0, height * 0.83, 1.62);
      camera.lookAt(0.0, height * 0.81, 0.0);
      lookAtTarget.position.set(0.0, height * 0.82, 1.62);

      if (vrm.lookAt) {
        vrm.lookAt.target = lookAtTarget;
      }

      mixer = new THREE.AnimationMixer(vrm.scene);
      applyEmotion(currentEmotion);
      spawnLateralDialog("Sistema Amadeus en línea. ¿En qué trabajamos hoy?", 3200);
    },
    undefined,
    (err) => {
      console.error("VRM Load Error:", err?.message || err);
      spawnLateralDialog("Abre ⚙️ Panel para cargar tu archivo .vrm.", 6000);
    }
  );
}

function applyEmotion(emotion) {
  currentEmotion = emotion || 'neutral';
  for (const k in targetEmotionWeights) targetEmotionWeights[k] = 0.0;

  if (currentEmotion === 'smug') {
    targetEmotionWeights.happy = 0.75;
    targetEmotionWeights.relaxed = 0.25;
  } else if (currentEmotion === 'tsundere_blush') {
    targetEmotionWeights.angry = 0.45;
    targetEmotionWeights.relaxed = 0.35;
    targetEmotionWeights.surprised = 0.15;
  } else if (currentEmotion === 'analytical') {
    targetEmotionWeights.relaxed = 0.65;
    targetEmotionWeights.neutral = 0.25;
  } else if (currentEmotion === 'serious') {
    targetEmotionWeights.angry = 0.7;
    targetEmotionWeights.neutral = 0.2;
  } else if (currentEmotion === 'surprised') {
    targetEmotionWeights.surprised = 0.9;
    targetEmotionWeights.happy = 0.1;
  } else if (currentEmotion === 'happy') {
    targetEmotionWeights.happy = 0.95;
  } else {
    targetEmotionWeights.neutral = 1.0;
  }
}

function triggerGesture(gestureName) {
  currentGesture = gestureName || 'idle';
  gestureTimer = 2.6;
  activeCustomPose = null;
}

function applyCustomGesturePreview(pose) {
  if (!pose) return;
  activeCustomPose = pose;
  customPoseTimer = parseFloat(pose.duration_sec) || 3.5;
  if (pose.linked_emotion) {
    applyEmotion(pose.linked_emotion);
  }
}

const clock = new THREE.Clock();
let nextBlinkTime = 3.0;
let blinkProgress = -1;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  if (mixer) mixer.update(delta);

  if (currentVrm) {
    const hum = currentVrm.humanoid;
    const em = currentVrm.expressionManager;

    const spine = hum?.getNormalizedBoneNode('spine');
    const chest = hum?.getNormalizedBoneNode('chest') || hum?.getNormalizedBoneNode('upperChest');
    const head = hum?.getNormalizedBoneNode('head');
    const rightArm = hum?.getNormalizedBoneNode('rightUpperArm');
    const leftArm = hum?.getNormalizedBoneNode('leftUpperArm');
    const rightShoulder = hum?.getNormalizedBoneNode('rightShoulder');
    const leftShoulder = hum?.getNormalizedBoneNode('leftShoulder');

    // 1. Natural Organic Breathing Cycle (~13.5 breaths/min = ~0.22 Hz)
    const breathRate = 1.42;
    const breath = Math.sin(elapsed * breathRate) * 0.75 + Math.sin(elapsed * (breathRate * 2.0)) * 0.25;
    const breathPositive = Math.max(0, breath);

    if (spine) {
      spine.rotation.x = breath * 0.014;
      spine.rotation.z = Math.sin(elapsed * 0.75) * 0.008; // subtle organic weight shift
    }
    if (chest) {
      chest.rotation.x = breath * 0.018; // ribcage breathing expansion
    }
    if (rightShoulder) rightShoulder.rotation.z = -breathPositive * 0.012;
    if (leftShoulder) leftShoulder.rotation.z = breathPositive * 0.012;

    // 2. Smooth Gesture Blending (Attack & Release)
    if (gestureTimer > 0) {
      gestureTimer -= delta;
      gestureBlend = Math.min(1.0, gestureBlend + delta * 5.0);
    } else {
      gestureBlend = Math.max(0.0, gestureBlend - delta * 3.5);
      if (gestureBlend <= 0.0) currentGesture = 'idle';
    }

    const armSign = -1;
    let rArmZ = armSign * 1.18 + Math.sin(elapsed * 1.5) * 0.015;
    let rArmX = 0.06;
    let lArmZ = -armSign * 1.18 - Math.sin(elapsed * 1.5) * 0.015;
    let lArmX = 0.06;

    let headTargetX = 0;
    let headTargetZ = 0;

    // Conversational Kinesics during speech: subtle expressive head/torso motion tailored to emotion
    if (isPlayingQueue) {
      if (currentEmotion === 'analytical' || currentEmotion === 'serious') {
        headTargetX += Math.sin(elapsed * 4.2) * 0.024; // Subtle scholarly emphasis
      } else if (currentEmotion === 'happy') {
        headTargetZ += Math.sin(elapsed * 3.2) * 0.035; // Cheerful rhythm
        headTargetX += Math.sin(elapsed * 4.2) * 0.022;
      } else if (currentEmotion === 'smug') {
        headTargetX -= 0.035; // Proud chin up
      } else if (currentEmotion === 'tsundere_blush') {
        headTargetZ -= 0.045; // Turn head slightly away
        headTargetX += Math.sin(elapsed * 5.2) * 0.016;
      } else {
        headTargetX += Math.sin(elapsed * 4.0) * 0.018;
      }
    }

    if (activeCustomPose && customPoseTimer > 0) {
      customPoseTimer -= delta;
      const cp = activeCustomPose;
      const mSpeed = parseFloat(cp.motion_speed) || 1.0;
      const mAmp = cp.motion_amplitude !== undefined ? parseFloat(cp.motion_amplitude) : 0.25;

      let osc = 0;
      if (cp.motion_type === 'wave') {
        osc = Math.sin(elapsed * 10.0 * mSpeed) * 0.32 * mAmp;
      } else if (cp.motion_type === 'nod') {
        headTargetX += Math.sin(elapsed * 8.0 * mSpeed) * 0.16 * mAmp;
      } else if (cp.motion_type === 'breathe') {
        osc = Math.sin(elapsed * 3.0 * mSpeed) * 0.08 * mAmp;
      } else if (cp.motion_type === 'bounce') {
        headTargetX += Math.abs(Math.sin(elapsed * 6.5 * mSpeed)) * -0.05 * mAmp;
      }

      headTargetX = THREE.MathUtils.lerp(headTargetX, (parseFloat(cp.head_x) || 0) * 0.45, 0.2);
      headTargetZ = THREE.MathUtils.lerp(headTargetZ, (parseFloat(cp.head_z) || 0) * 0.35, 0.2);

      const targetRz = (parseFloat(cp.r_arm_z) || 0) * armSign + osc;
      const targetRx = parseFloat(cp.r_arm_x) || 0;
      const targetLz = (parseFloat(cp.l_arm_z) || 0) * -armSign - osc;
      const targetLx = parseFloat(cp.l_arm_x) || 0;

      rArmZ = THREE.MathUtils.lerp(rArmZ, targetRz, 0.2);
      rArmX = THREE.MathUtils.lerp(rArmX, targetRx, 0.2);
      lArmZ = THREE.MathUtils.lerp(lArmZ, targetLz, 0.2);
      lArmX = THREE.MathUtils.lerp(lArmX, targetLx, 0.2);

      if (customPoseTimer <= 0) {
        activeCustomPose = null;
      }
    } else if (gestureBlend > 0.001) {
      if (currentGesture === 'wave') {
        const waveAngle = -armSign * 0.88 + Math.sin(elapsed * 12.0) * 0.28;
        rArmZ = THREE.MathUtils.lerp(rArmZ, waveAngle, gestureBlend);
        rArmX = THREE.MathUtils.lerp(rArmX, -0.22, gestureBlend);
        headTargetZ = THREE.MathUtils.lerp(headTargetZ, 0.08, gestureBlend);
      } else if (currentGesture === 'nod') {
        headTargetX = THREE.MathUtils.lerp(headTargetX, Math.sin(elapsed * 8.5) * 0.16, gestureBlend);
      } else if (currentGesture === 'think' || currentGesture === 'lab_coat_think') {
        // Canonical Kurisu Thinking Pose: right hand to chin, left arm supporting elbow
        headTargetZ = THREE.MathUtils.lerp(headTargetZ, 0.14, gestureBlend);
        headTargetX = THREE.MathUtils.lerp(headTargetX, 0.08, gestureBlend);
        rArmZ = THREE.MathUtils.lerp(rArmZ, armSign * 0.38, gestureBlend);
        rArmX = THREE.MathUtils.lerp(rArmX, 0.78, gestureBlend);
        lArmZ = THREE.MathUtils.lerp(lArmZ, -armSign * 0.78, gestureBlend);
        lArmX = THREE.MathUtils.lerp(lArmX, 0.35, gestureBlend);
      } else if (currentGesture === 'point' || currentGesture === 'explain') {
        // Pointing to explain theory with rhythmic emphasis
        rArmX = THREE.MathUtils.lerp(rArmX, -0.88, gestureBlend);
        rArmZ = THREE.MathUtils.lerp(rArmZ, -armSign * 0.32, gestureBlend);
        headTargetX = THREE.MathUtils.lerp(headTargetX, 0.04, gestureBlend);
      } else if (currentGesture === 'cross_arms' || currentGesture === 'tsundere') {
        // Iconic Tsundere Pose: crossed arms + slight head deflection
        rArmZ = THREE.MathUtils.lerp(rArmZ, armSign * 0.68, gestureBlend);
        rArmX = THREE.MathUtils.lerp(rArmX, 0.48, gestureBlend);
        lArmZ = THREE.MathUtils.lerp(lArmZ, -armSign * 0.68, gestureBlend);
        lArmX = THREE.MathUtils.lerp(lArmX, 0.48, gestureBlend);
        headTargetZ = THREE.MathUtils.lerp(headTargetZ, -0.09, gestureBlend);
      } else if (currentGesture === 'shy' || currentGesture === 'bashful') {
        // Bashful: arms held inward, head down
        headTargetX = THREE.MathUtils.lerp(headTargetX, 0.12, gestureBlend);
        headTargetZ = THREE.MathUtils.lerp(headTargetZ, -0.08, gestureBlend);
        rArmZ = THREE.MathUtils.lerp(rArmZ, armSign * 0.98, gestureBlend);
        lArmZ = THREE.MathUtils.lerp(lArmZ, -armSign * 0.98, gestureBlend);
        rArmX = THREE.MathUtils.lerp(rArmX, 0.22, gestureBlend);
        lArmX = THREE.MathUtils.lerp(lArmX, 0.22, gestureBlend);
      } else if (currentGesture === 'smug') {
        // Confident smirk pose
        headTargetX = THREE.MathUtils.lerp(headTargetX, -0.06, gestureBlend);
        headTargetZ = THREE.MathUtils.lerp(headTargetZ, 0.06, gestureBlend);
        rArmZ = THREE.MathUtils.lerp(rArmZ, armSign * 0.72, gestureBlend);
        rArmX = THREE.MathUtils.lerp(rArmX, 0.25, gestureBlend);
      } else if (currentGesture === 'cheer') {
        // Cheerful victory celebration
        const cheerAngle = -armSign * 1.35 + Math.sin(elapsed * 10.0) * 0.22;
        rArmZ = THREE.MathUtils.lerp(rArmZ, cheerAngle, gestureBlend);
        lArmZ = THREE.MathUtils.lerp(lArmZ, -cheerAngle, gestureBlend);
        rArmX = THREE.MathUtils.lerp(rArmX, -0.65, gestureBlend);
        lArmX = THREE.MathUtils.lerp(lArmX, -0.65, gestureBlend);
        headTargetX = THREE.MathUtils.lerp(headTargetX, -0.12, gestureBlend);
      }
    }

    if (rightArm) {
      rightArm.rotation.z = rArmZ;
      rightArm.rotation.x = rArmX;
    }
    if (leftArm) {
      leftArm.rotation.z = lArmZ;
      leftArm.rotation.x = lArmX;
    }
    if (head) {
      head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, headTargetX, Math.min(1.0, delta * 6.0));
      head.rotation.z = THREE.MathUtils.lerp(head.rotation.z, headTargetZ, Math.min(1.0, delta * 6.0));
    }

    // 3. Gaze Tracking with Eye Microsaccades & Emotional Aversion
    if (elapsed >= nextSaccadeTime) {
      nextSaccadeTime = elapsed + 0.8 + Math.random() * 1.5;
      saccadeOffset.set(
        (Math.random() - 0.5) * 0.07,
        (Math.random() - 0.5) * 0.05,
        0
      );
    }

    if (currentVrm.lookAt) {
      const headBone = hum?.getNormalizedBoneNode('head');
      const headWorldPos = new THREE.Vector3();
      if (headBone) headBone.getWorldPosition(headWorldPos);
      else headWorldPos.set(0, 1.35, 0);

      let gazeModX = mouseNormX * 0.35 + saccadeOffset.x;
      let gazeModY = mouseNormY * 0.25 + saccadeOffset.y;

      // Tsundere emotional gaze aversion: breaks direct gaze sideways bashfully
      if (currentEmotion === 'tsundere_blush' && Math.sin(elapsed * 1.2) > 0.3) {
        gazeModX = -0.22 + saccadeOffset.x * 0.4;
        gazeModY = -0.14 + saccadeOffset.y * 0.4;
      }

      const desiredLookAt = new THREE.Vector3(
        headWorldPos.x + gazeModX,
        headWorldPos.y + gazeModY,
        headWorldPos.z + 1.6
      );

      lookAtTarget.position.lerp(desiredLookAt, Math.min(1.0, delta * 7.0));
    }

    // 4. Smooth Expression Morphing (LERP) & Natural Blinking
    if (em) {
      for (const key in emotionWeights) {
        emotionWeights[key] += (targetEmotionWeights[key] - emotionWeights[key]) * Math.min(1.0, delta * 6.5);
        em.setValue(key, emotionWeights[key]);
      }

      if (elapsed >= nextBlinkTime) {
        blinkProgress = 0.0;
        nextBlinkTime = elapsed + 2.4 + Math.random() * 3.6;
      }
      if (blinkProgress >= 0.0) {
        blinkProgress += delta * 9.5;
        const blinkVal = blinkProgress <= 1.0 ? blinkProgress : Math.max(0.0, 2.0 - blinkProgress);
        em.setValue('blink', blinkVal);
        if (blinkProgress >= 2.0) blinkProgress = -1;
      }

      // 5. Emotion-Driven Rhythmic Syllabic Speech Animation (Decoupled from loud decibels)
      if (isPlayingQueue) {
        // Natural human syllabic pace (~4.2 Hz cadence)
        const sylFreq = 4.2;
        const sylPhase = elapsed * Math.PI * 2.0 * sylFreq;
        const baseSyllable = Math.sin(sylPhase);
        const harmonicSyllable = Math.sin(sylPhase * 0.5 + 0.35) * 0.28;
        const rawMouthOpen = Math.max(0, baseSyllable * 0.72 + harmonicSyllable);

        // Maximum aperture and mouth shape tailored to Kurisu's active emotion
        let maxAperture = 0.40;
        let vRatioAa = 0.45;
        let vRatioEe = 0.30;
        let vRatioIh = 0.15;
        let vRatioOh = 0.10;

        if (currentEmotion === 'tsundere_blush') {
          // Tense, bashful mouth opening; tighter articulation, small aperture
          maxAperture = 0.28;
          vRatioAa = 0.20;
          vRatioEe = 0.45;
          vRatioIh = 0.30;
          vRatioOh = 0.05;
        } else if (currentEmotion === 'analytical') {
          // Measured, sharp scholarly articulation
          maxAperture = 0.35;
          vRatioAa = 0.35;
          vRatioEe = 0.35;
          vRatioIh = 0.20;
          vRatioOh = 0.10;
        } else if (currentEmotion === 'smug') {
          // Maintains smirk curvature, moderate vertical opening
          maxAperture = 0.32;
          vRatioAa = 0.25;
          vRatioEe = 0.50;
          vRatioIh = 0.20;
          vRatioOh = 0.05;
        } else if (currentEmotion === 'serious') {
          maxAperture = 0.36;
          vRatioAa = 0.40;
          vRatioEe = 0.30;
          vRatioIh = 0.20;
          vRatioOh = 0.10;
        } else if (currentEmotion === 'happy') {
          // Expressive, open
          maxAperture = 0.52;
          vRatioAa = 0.55;
          vRatioEe = 0.30;
          vRatioIh = 0.05;
          vRatioOh = 0.10;
        } else if (currentEmotion === 'surprised') {
          maxAperture = 0.60;
          vRatioAa = 0.30;
          vRatioOh = 0.50;
          vRatioIh = 0.05;
          vRatioEe = 0.15;
        }

        const mouthValue = rawMouthOpen * maxAperture;
        targetVisemes.aa = mouthValue * vRatioAa;
        targetVisemes.ee = mouthValue * vRatioEe;
        targetVisemes.ih = mouthValue * vRatioIh;
        targetVisemes.oh = mouthValue * vRatioOh;
        targetVisemes.ou = mouthValue * (vRatioOh * 0.7);
      } else {
        targetVisemes.aa = 0;
        targetVisemes.ih = 0;
        targetVisemes.ou = 0;
        targetVisemes.ee = 0;
        targetVisemes.oh = 0;
      }

      // Fast attack & smooth release envelope
      const attack = delta * 24.0;
      const release = delta * 12.0;
      for (const v of ['aa', 'ih', 'ou', 'ee', 'oh']) {
        const tgt = targetVisemes[v] || 0;
        const cur = currentVisemes[v] || 0;
        currentVisemes[v] += (tgt - cur) * (tgt > cur ? attack : release);
        try { em.setValue(v, currentVisemes[v]); } catch (_) {}
      }
    }

    currentVrm.update(delta);
  }
  renderer.render(scene, camera);
}

let activeDialogTimers = [];
let currentTypewriterTimer = null;
let notesCardAutoCloseTimer = null;

function removeBubbleSmoothly(bubble) {
  if (!bubble || bubble.classList.contains('exiting')) return;
  bubble.classList.add('exiting');
  setTimeout(() => {
    if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
  }, 350);
}

function clearAllLateralDialogs() {
  while (activeDialogTimers.length > 0) {
    const t = activeDialogTimers.pop();
    clearTimeout(t);
    clearInterval(t);
  }
  if (currentTypewriterTimer) {
    clearInterval(currentTypewriterTimer);
    currentTypewriterTimer = null;
  }
  const stream = document.getElementById('sideDialogStream');
  if (stream) {
    Array.from(stream.children).forEach((b) => removeBubbleSmoothly(b));
  }
}

function cleanBubbleText(raw) {
  if (!raw) return '';
  return String(raw)
    .replace(/\[(?:emotion|gesture|mood|action):[^\]]+\]/gi, '')
    .replace(/\b(?:mood|emotion|gesture)\s*:\s*\w+/gi, '')
    .replace(/\*[^*]+\*/g, '')
    .replace(/^Amadeus\s*:\s*/i, '')
    .replace(/---DETALLE---[\s\S]*$/i, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Spawns a synchronized bubble, types text pacing to voice duration, and calls onComplete when done
function spawnSyncedBubble(text, targetDurationMs, onTypewriterComplete) {
  const clean = cleanBubbleText(text);
  if (!clean || bubblesMode === 'off') {
    if (onTypewriterComplete) onTypewriterComplete();
    return null;
  }

  const stream = document.getElementById('sideDialogStream');
  if (!stream) {
    if (onTypewriterComplete) onTypewriterComplete();
    return null;
  }

  const activeBubbles = Array.from(stream.querySelectorAll('.side-bubble:not(.exiting)'));
  while (activeBubbles.length >= 2) {
    const oldest = activeBubbles.shift();
    removeBubbleSmoothly(oldest);
  }

  const bubble = document.createElement('div');
  bubble.className = 'aero-glass side-bubble';
  const spanText = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  cursor.textContent = '▍';
  bubble.appendChild(spanText);
  bubble.appendChild(cursor);
  stream.appendChild(bubble);

  requestAnimationFrame(() => bubble.classList.add('visible'));

  let idx = 0;
  // Dynamic typewriter pacing: calibrated to finish ~12% before audio concludes
  const safeDuration = Math.max(700, targetDurationMs);
  const charDelay = Math.max(14, Math.min(55, Math.floor((safeDuration * 0.88) / Math.max(1, clean.length))));

  if (currentTypewriterTimer) {
    clearInterval(currentTypewriterTimer);
    currentTypewriterTimer = null;
  }

  currentTypewriterTimer = setInterval(() => {
    idx += 1;
    spanText.textContent = clean.slice(0, idx);
    if (idx >= clean.length) {
      clearInterval(currentTypewriterTimer);
      currentTypewriterTimer = null;
      cursor.remove();
      if (onTypewriterComplete) onTypewriterComplete();
    }
  }, charDelay);

  return bubble;
}

function spawnLateralDialog(text, durationMs = 2400) {
  const bubble = spawnSyncedBubble(text, durationMs, () => {
    const holdTimer = setTimeout(() => removeBubbleSmoothly(bubble), 2600);
    activeDialogTimers.push(holdTimer);
  });
  return bubble;
}

// Sequential Sentence Audio Queue synchronized with Lateral Dialogue Bubbles
async function playNextSentenceChunk() {
  if (audioQueue.length === 0) {
    isPlayingQueue = false;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'audio_playing', playing: false }));
    }
    return;
  }
  isPlayingQueue = true;
  const item = audioQueue.shift();
  applyEmotion(item.emotion);
  triggerGesture(item.gesture);

  const cleanText = cleanBubbleText(item.sentence || '');
  const estimatedMs = Math.max(1500, cleanText.length * 52);

  let audioFinished = false;
  let typewriterFinished = false;
  let isAdvanced = false;
  let activeBubble = null;

  const tryAdvance = () => {
    if (isAdvanced) return;
    if (audioFinished && typewriterFinished) {
      isAdvanced = true;
      // Hold reading period (1.1s - 2.2s) so user comfortably reads before next sentence
      const holdMs = Math.min(2200, Math.max(1100, cleanText.length * 15));
      setTimeout(() => {
        if (activeBubble) removeBubbleSmoothly(activeBubble);
        playNextSentenceChunk();
      }, holdMs);
    }
  };

  // Case 1: No voice audio attached -> drive purely by dynamic reading typewriter
  if (!item.audio_b64) {
    audioFinished = true;
    activeBubble = spawnSyncedBubble(cleanText, estimatedMs, () => {
      typewriterFinished = true;
      tryAdvance();
    });
    return;
  }

  // Case 2: Voice audio attached -> measure real duration and synchronize
  ensureAudioGraph();
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume().catch(() => {});
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'audio_playing', playing: true }));
  }

  let startedSyncedBubble = false;
  const startBubbleWithRealDuration = () => {
    if (startedSyncedBubble) return;
    startedSyncedBubble = true;
    const realMs = (audioEl.duration && isFinite(audioEl.duration) && audioEl.duration > 0.15)
      ? Math.round(audioEl.duration * 1000)
      : estimatedMs;
    activeBubble = spawnSyncedBubble(cleanText, realMs, () => {
      typewriterFinished = true;
      tryAdvance();
    });
  };

  audioEl.onloadedmetadata = () => startBubbleWithRealDuration();
  audioEl.onended = () => {
    audioFinished = true;
    tryAdvance();
  };
  audioEl.onerror = () => {
    audioFinished = true;
    startBubbleWithRealDuration();
    typewriterFinished = true;
    tryAdvance();
  };

  audioEl.src = `data:${item.mime || 'audio/mpeg'};base64,${item.audio_b64}`;
  audioEl.play()
    .then(() => startBubbleWithRealDuration())
    .catch(() => {
      audioFinished = true;
      startBubbleWithRealDuration();
      typewriterFinished = true;
      tryAdvance();
    });
}

let turnBuffers = new Map();

function flushTurnQueue(turnId) {
  const turn = turnBuffers.get(turnId);
  if (!turn) return;
  turnBuffers.delete(turnId);
  if (turn.timer) clearTimeout(turn.timer);

  // Sort chunks strictly by sentence index
  turn.chunks.sort((a, b) => a.index - b.index);

  for (const c of turn.chunks) {
    audioQueue.push(c);
  }

  // Only start playback now that the entire dialogue queue is 100% generated
  if (!isPlayingQueue) {
    playNextSentenceChunk();
  }
}

async function initConnection() {
  if (!window.amadeusDesktop) return;
  const info = await window.amadeusDesktop.getConnectionInfo();
  if (!info || !info.wsPort) {
    setTimeout(initConnection, 500);
    return;
  }
  httpUrl = info.httpUrl;
  loadVrmModel(`${httpUrl}/api/avatar.vrm?token=${encodeURIComponent(info.wsToken)}&t=${Date.now()}`);

  function connectWs() {
    ws = new WebSocket(`ws://127.0.0.1:${info.wsPort}/ws?token=${info.wsToken}`);

    ws.onclose = () => {
      console.warn("Avatar WebSocket closed. Reconnecting in 1.5s...");
      setTimeout(connectWs, 1500);
    };

    ws.onerror = (err) => {
      console.warn("Avatar WebSocket error:", err);
    };

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'connected') {
        bubblesMode = msg.bubbles_mode || 'all';
        if (msg.dsp_preset) applyAudioDspPreset(msg.dsp_preset);
      } else if (msg.type === 'dsp_changed') {
        if (msg.dsp_preset) applyAudioDspPreset(msg.dsp_preset);
        if (msg.bubbles_mode) bubblesMode = msg.bubbles_mode;
      } else if (msg.type === 'settings_reloaded') {
        if (msg.settings) {
          if (msg.settings.dsp_preset) applyAudioDspPreset(msg.settings.dsp_preset);
          if (msg.settings.bubbles_mode) bubblesMode = msg.settings.bubbles_mode;
        }
      } else if (msg.type === 'character_switched') {
        if (msg.character) {
          if (msg.character.name) document.title = `${msg.character.name} - Amadeus`;
          if (msg.character.dsp_preset) applyAudioDspPreset(msg.character.dsp_preset);
        }
      } else if (msg.type === 'reload_vrm') {
        loadVrmModel(`${httpUrl}/api/avatar.vrm?token=${encodeURIComponent(info.wsToken)}&t=${Date.now()}`);
      } else if (msg.type === 'avatar_pose') {
        applyEmotion(msg.emotion);
        triggerGesture(msg.gesture);
        if (msg.phrase) {
          spawnLateralDialog(msg.phrase, 3200);
        }
      } else if (msg.type === 'preview_gesture') {
        if (msg.pose) {
          applyCustomGesturePreview(msg.pose);
        }
      } else if (msg.type === 'mic_transcript') {
        spawnLateralDialog(`🗣️ Tú: "${msg.text}"`, 2600);
      } else if (msg.type === 'interrupt') {
        turnBuffers.forEach((t) => {
          if (t.timer) clearTimeout(t.timer);
        });
        turnBuffers.clear();
        audioQueue.length = 0;
        audioEl.pause();
        isPlayingQueue = false;
        clearAllLateralDialogs();
        closeScreenNotes();
      } else if (msg.type === 'reply_detail') {
        if (msg.detail) {
          showScreenNotes(msg.detail);
        }
      } else if (msg.type === 'reply_chunk') {
        const tid = msg.turn_id || 'default';
        if (!turnBuffers.has(tid)) {
          turnBuffers.set(tid, {
            chunks: [],
            total: msg.total || 1,
            timer: setTimeout(() => flushTurnQueue(tid), 4000)
          });
        }
        const turn = turnBuffers.get(tid);
        turn.chunks.push(msg);
        if (msg.total) turn.total = msg.total;

        // When all chunks of the turn are generated and received, flush to audioQueue!
        if (turn.chunks.length >= turn.total) {
          flushTurnQueue(tid);
        }
      } else if (msg.type === 'turn_complete') {
        const tid = msg.turn_id || 'default';
        flushTurnQueue(tid);
      } else if (msg.type === 'confirm_request') {
        pendingOpId = msg.id;
        document.getElementById('confirmText').textContent = msg.summary;
        document.getElementById('confirmCard').style.display = 'flex';
        if (window.amadeusDesktop && window.amadeusDesktop.setInteractiveState) {
          window.amadeusDesktop.setInteractiveState({ confirmCard: true });
        }
        triggerGesture('think');
      } else if (msg.type === 'listening') {
        const pill = document.getElementById('statePill');
        const micBtn = document.getElementById('micBtn');
        if (msg.state === 'thinking') {
          pill.textContent = '✨ Pensando...';
          pill.style.display = 'block';
          if (micBtn) micBtn.textContent = '🎙️ Micro';
          triggerGesture('think');
        } else if (msg.state === 'recording') {
          pill.textContent = '🎙️ Habla ahora... (clic en Micro para enviar)';
          pill.style.display = 'block';
          if (micBtn) micBtn.textContent = '🔴 Enviar';
        } else {
          pill.style.display = 'none';
          if (micBtn) micBtn.textContent = '🎙️ Micro';
        }
      }
    };
  }

  connectWs();

  window.amadeusDesktop.onShortcutEvent((action) => {
    if (action === 'toggle-input') {
      window.toggleQuickBar();
    } else if (action === 'push-to-talk') {
      window.toggleVoiceMic();
    } else if (action === 'look-screen') {
      window.triggerScreenLook();
    }
  });
}

initConnection();
</script>
</body>
</html>
