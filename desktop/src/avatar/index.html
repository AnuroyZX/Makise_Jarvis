<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Amadeus Avatar Overlay</title>
<style>
  :root {
    --sky-50: #f2f9ff;
    --sky-100: #e3f2ff;
    --sky-200: #c7e5ff;
    --sky-400: #7cc4fa;
    --sky-600: #2f8fdc;
    --ink: #122840;
    --glass: rgba(232, 246, 255, 0.78);
    --glass-edge: rgba(255, 255, 255, 0.92);
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  /* Dedicated 3D Stage on the right side so lateral dialogues NEVER cover Kurisu */
  #stageCanvas {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 350px; height: 100%;
    pointer-events: none;
  }
  /* Windows 7 Aero Gloss + Soft Air Light-Blue Glass Card */
  .aero-glass {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.86) 0%, var(--glass) 50%, rgba(186,226,255,0.72) 100%);
    border: 1.5px solid var(--glass-edge);
    border-radius: 13px;
    color: var(--ink);
    box-shadow: 0 8px 24px rgba(47, 143, 220, 0.22), inset 0 1px 1px rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px) saturate(145%);
  }
  /* Lateral Dynamic Dialogue Stream (Left Column) */
  #sideDialogStream {
    position: absolute;
    top: 36px;
    left: 10px;
    width: 226px;
    bottom: 112px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    z-index: 20;
    pointer-events: none;
  }
  .side-bubble {
    padding: 9px 12px;
    font-size: 0.82rem;
    line-height: 1.38;
    border-top-right-radius: 4px;
    opacity: 0;
    transform: translateX(-14px) scale(0.96);
    transition: opacity 0.28s ease, transform 0.28s ease;
    pointer-events: auto;
    user-select: text;
    word-wrap: break-word;
  }
  .side-bubble.visible {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  .side-bubble.exiting {
    opacity: 0;
    transform: translateX(-16px) scale(0.92);
  }
  .typing-cursor {
    display: inline-block;
    color: var(--sky-600);
    font-weight: 700;
    animation: blinkCursor 0.6s infinite;
  }
  @keyframes blinkCursor {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  #confirmCard {
    position: absolute; bottom: 120px; left: 10px; width: 235px;
    padding: 11px; display: none; z-index: 30;
  }
  #quickInputBar {
    position: absolute; bottom: 54px; left: 16px; right: 16px;
    padding: 7px 10px; display: none; gap: 6px; align-items: center; z-index: 25;
  }
  #miniDock {
    position: absolute; bottom: 10px; right: 16px;
    display: flex; gap: 6px; padding: 6px 10px; z-index: 22;
    white-space: nowrap; align-items: center;
  }
  .btn-drag {
    -webkit-app-region: drag;
    cursor: grab;
    background: rgba(255, 255, 255, 0.88);
    color: var(--sky-600);
    border: 1px solid var(--sky-400);
    padding: 6px 9px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.78rem;
  }
  #miniDock button {
    -webkit-app-region: no-drag;
  }
  #quickInput {
    flex: 1; border: 1px solid rgba(47,143,220,0.45);
    background: rgba(255,255,255,0.9); color: var(--ink);
    padding: 7px 10px; border-radius: 8px; outline: none; font-size: 0.84rem;
  }
  .btn-air {
    background: linear-gradient(180deg, #6ec3ff 0%, #2f8fdc 100%);
    color: #fff; border: 1px solid rgba(255,255,255,0.85);
    padding: 6px 10px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.78rem;
  }
  #statePill {
    position: absolute; top: 12px; left: 12px;
    padding: 4px 10px; font-size: 0.74rem; font-weight: 600;
    display: none; z-index: 25;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.2/lib/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.1.2/lib/three-vrm-animation.module.min.js"
  }
}
</script>
</head>
<body>
  <!-- Lateral Real-Time Typewriter & Self-Erasing Dialogue Stream -->
  <div id="sideDialogStream"></div>

  <!-- Right-side Unobstructed 3D VRM Stage -->
  <div id="stageCanvas"></div>

  <!-- File Operation Confirmation Card -->
  <div id="confirmCard" class="aero-glass">
    <div id="confirmText" style="font-size:0.82rem; margin-bottom:8px; font-weight:600;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn-air" onclick="sendConfirm(true)">✓ Confirmar</button>
      <button class="btn-air" style="background:#64748b;" onclick="sendConfirm(false)">✕ Cancelar</button>
    </div>
  </div>

  <!-- Listening / Thinking Pill -->
  <div id="statePill" class="aero-glass">🎙️ Escuchando...</div>

  <!-- Floating Quick Input Bar (Ctrl+Alt+Space) -->
  <div id="quickInputBar" class="aero-glass">
    <input id="quickInput" placeholder="Habla con Kurisu (Enter para enviar, Esc para ocultar)...">
    <button class="btn-air" onclick="submitQuickInput()">Enviar</button>
  </div>

  <!-- Soft Air Mini-Dock under Kurisu -->
  <div id="miniDock" class="aero-glass">
    <span class="btn-drag" title="Arrastra aquí para mover a Kurisu">✥ Mover</span>
    <button class="btn-air" onclick="toggleQuickBar()" title="Ctrl+Alt+Espacio">💬 Hablar</button>
    <button class="btn-air" onclick="triggerScreenLook()" title="Ctrl+Alt+V">👁️ Pantalla</button>
    <button class="btn-air" onclick="openPanelWindow()" title="Abrir Ventana Soft Air">⚙️ Panel</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';

let currentVrm = null;
let mixer = null;
let currentEmotion = 'neutral';
let currentGesture = 'idle';
let gestureTimer = 0;
let bubblesMode = 'all';
let ws = null;
let httpUrl = '';
let pendingOpId = '';

// Open-LLM-VTuber Sequential Sentence Audio Queue + Fault-Tolerant AnalyserNode Lip-Sync
const audioQueue = [];
let isPlayingQueue = false;
let audioCtx = null;
let analyser = null;
let freqData = null;
const audioEl = new Audio();

function ensureAudioGraph() {
  if (audioCtx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    const mediaSource = audioCtx.createMediaElementSource(audioEl);
    mediaSource.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch (e) {
    console.warn("WebAudio fallback mode:", e);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('quickInputBar').style.display = 'none';
  }
});

// 3D Transparent Stage (Right 350px column)
const container = document.getElementById('stageCanvas');
const stageW = 350;
const stageH = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(stageW, stageH);
renderer.setPixelRatio(1.0);
container.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(28.0, stageW / stageH, 0.1, 20.0);
camera.position.set(0.0, 1.32, 1.65);
camera.lookAt(0.0, 1.28, 0.0);

const scene = new THREE.Scene();
const dirLight = new THREE.DirectionalLight(0xffffff, Math.PI * 0.95);
dirLight.position.set(1.2, 2.2, 2.0);
scene.add(dirLight);
scene.add(new THREE.AmbientLight(0xdbeafe, 1.35));

const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
loader.register((parser) => new VRMAnimationLoaderPlugin(parser));

function loadVrmModel(url) {
  console.log("Loading VRM from:", url);
  loader.load(
    url,
    (gltf) => {
      const vrm = gltf.userData.vrm;
      console.log("VRM loaded! metaVersion:", vrm?.meta?.metaVersion);
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      if (currentVrm) {
        scene.remove(currentVrm.scene);
        VRMUtils.deepDispose(currentVrm.scene);
      }
      currentVrm = vrm;
      VRMUtils.rotateVRM0(vrm);
      scene.add(vrm.scene);
      const box = new THREE.Box3().setFromObject(vrm.scene);
      const height = Math.max(1.2, box.max.y - box.min.y);
      // Full head + upper body framing with zero obstruction above her head
      camera.position.set(0.0, height * 0.83, 1.62);
      camera.lookAt(0.0, height * 0.81, 0.0);
      mixer = new THREE.AnimationMixer(vrm.scene);
      applyEmotion(currentEmotion);
      playSentenceBubblesWithAudio("Sistema Amadeus en línea. ¿En qué trabajamos hoy?", 3200);
    },
    undefined,
    (err) => {
      console.error("VRM Load Error:", err?.message || err);
      spawnLateralDialog("Abre ⚙️ Panel para cargar tu archivo .vrm.", 6000);
    }
  );
}

function applyEmotion(emotion) {
  currentEmotion = emotion || 'neutral';
  if (!currentVrm || !currentVrm.expressionManager) return;
  const em = currentVrm.expressionManager;
  for (const preset of ['neutral', 'happy', 'angry', 'sad', 'relaxed', 'surprised']) {
    em.setValue(preset, 0.0);
  }
  if (currentEmotion === 'smug') em.setValue('happy', 0.85);
  else if (currentEmotion === 'tsundere_blush') { em.setValue('angry', 0.45); em.setValue('relaxed', 0.4); }
  else if (currentEmotion === 'analytical') em.setValue('relaxed', 0.65);
  else if (currentEmotion === 'serious') em.setValue('angry', 0.75);
  else if (currentEmotion === 'surprised') em.setValue('surprised', 0.9);
  else em.setValue('neutral', 1.0);
}

function triggerGesture(gestureName) {
  currentGesture = gestureName || 'idle';
  gestureTimer = 2.4;
}

const clock = new THREE.Clock();
let nextBlinkTime = 3.0;
let blinkProgress = -1;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  if (mixer) mixer.update(delta);

  if (currentVrm) {
    const hum = currentVrm.humanoid;
    const em = currentVrm.expressionManager;

    const spine = hum?.getNormalizedBoneNode('spine');
    const head = hum?.getNormalizedBoneNode('head');
    const rightArm = hum?.getNormalizedBoneNode('rightUpperArm');
    const leftArm = hum?.getNormalizedBoneNode('leftUpperArm');

    if (spine) {
      spine.rotation.x = Math.sin(elapsed * 2.1) * 0.018;
      spine.rotation.z = Math.cos(elapsed * 1.1) * 0.012;
    }

    const armSign = -1;
    if (rightArm) {
      rightArm.rotation.z = armSign * 1.18 + Math.sin(elapsed * 1.5) * 0.02;
      rightArm.rotation.x = 0.06;
    }
    if (leftArm) {
      leftArm.rotation.z = -armSign * 1.18 - Math.sin(elapsed * 1.5) * 0.02;
      leftArm.rotation.x = 0.06;
    }

    if (gestureTimer > 0) {
      gestureTimer -= delta;
      if (head) {
        if (currentGesture === 'nod') head.rotation.x = Math.sin(elapsed * 10.0) * 0.18;
        else if (currentGesture === 'think') head.rotation.z = 0.14;
      }
      if (rightArm) {
        if (currentGesture === 'wave') {
          rightArm.rotation.z = -armSign * 0.85 + Math.sin(elapsed * 12.0) * 0.25;
        } else if (currentGesture === 'point') {
          rightArm.rotation.x = -0.85;
        } else if (currentGesture === 'cross_arms') {
          rightArm.rotation.z = armSign * 0.65;
          rightArm.rotation.x = 0.45;
        }
      }
      if (leftArm && currentGesture === 'cross_arms') {
        leftArm.rotation.z = -armSign * 0.65;
        leftArm.rotation.x = 0.45;
      }
    } else if (head) {
      head.rotation.x *= 0.9;
      head.rotation.z *= 0.9;
    }

    if (em) {
      if (elapsed >= nextBlinkTime) {
        blinkProgress = 0.0;
        nextBlinkTime = elapsed + 2.5 + Math.random() * 3.5;
      }
      if (blinkProgress >= 0.0) {
        blinkProgress += delta * 9.0;
        const blinkVal = blinkProgress <= 1.0 ? blinkProgress : Math.max(0.0, 2.0 - blinkProgress);
        em.setValue('blink', blinkVal);
        if (blinkProgress >= 2.0) blinkProgress = -1;
      }

      if (isPlayingQueue) {
        let low = 0, mid = 0, high = 0;
        if (analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          for (let i = 1; i < 8; i++) low += freqData[i];
          for (let i = 8; i < 24; i++) mid += freqData[i];
          for (let i = 24; i < 48; i++) high += freqData[i];
        }
        if (low + mid + high > 10) {
          em.setValue('aa', Math.min(1.0, (low / (7 * 200))));
          em.setValue('ih', Math.min(0.8, (high / (24 * 210))));
          em.setValue('ou', Math.min(0.7, (mid / (16 * 220))));
        } else {
          em.setValue('aa', Math.max(0.0, Math.sin(elapsed * 16.0) * 0.65));
          em.setValue('ih', Math.max(0.0, Math.cos(elapsed * 11.0) * 0.35));
          em.setValue('ou', Math.max(0.0, Math.sin(elapsed * 7.5) * 0.30));
        }
      } else {
        em.setValue('aa', 0.0);
        em.setValue('ih', 0.0);
        em.setValue('ou', 0.0);
      }
    }

    currentVrm.update(delta);
  }
  renderer.render(scene, camera);
}
animate();

let activeDialogTimers = [];

function splitIntoSpokenPhrases(sentence) {
  const clean = (sentence || '').trim();
  if (!clean) return [];
  if (clean.length <= 52) return [clean];
  // Split at natural pause punctuation while keeping punctuation attached
  const rawParts = clean.split(/(?<=[,;:.!?—])\s+/);
  const merged = [];
  let buf = '';
  for (const part of rawParts) {
    if (!buf) {
      buf = part;
    } else if ((buf + ' ' + part).length <= 58) {
      buf += ' ' + part;
    } else {
      merged.push(buf);
      buf = part;
    }
  }
  if (buf) merged.push(buf);
  return merged;
}

/**
 * Displays phrases strictly one after another in order, with each bubble's
 * typewriter speed and start delay synchronized to the exact audio duration (`totalDurationMs`).
 */
function playSentenceBubblesWithAudio(sentence, totalDurationMs = 2600) {
  const phrases = splitIntoSpokenPhrases(sentence);
  if (phrases.length === 0 || bubblesMode === 'off') return;

  const totalChars = Math.max(1, phrases.reduce((acc, p) => acc + p.length, 0));
  let cumulativeDelayMs = 0;

  for (let i = 0; i < phrases.length; i++) {
    const phrase = phrases[i];
    const ratio = phrase.length / totalChars;
    const phraseSpeechMs = Math.max(700, Math.round(totalDurationMs * ratio));
    const startAtMs = cumulativeDelayMs;
    cumulativeDelayMs += phraseSpeechMs + 140;

    const timerId = setTimeout(() => {
      spawnLateralDialog(phrase, phraseSpeechMs, 2600);
    }, startAtMs);
    activeDialogTimers.push(timerId);
  }
}

/**
 * Spawns a single lateral Soft Air dialogue pill, types it over `typingDurationMs`
 * (matching the voice duration for that phrase), and erases itself after `holdAfterMs`.
 */
function spawnLateralDialog(text, typingDurationMs = 1400, holdAfterMs = 2600) {
  const clean = (text || '').trim();
  if (!clean || bubblesMode === 'off') return;

  const stream = document.getElementById('sideDialogStream');
  const activeBubbles = Array.from(stream.querySelectorAll('.side-bubble:not(.exiting)'));
  while (activeBubbles.length >= 3) {
    const oldest = activeBubbles.shift();
    removeBubbleSmoothly(oldest);
  }

  const bubble = document.createElement('div');
  bubble.className = 'aero-glass side-bubble';
  const spanText = document.createElement('span');
  const cursor = document.createElement('span');
  cursor.className = 'typing-cursor';
  cursor.textContent = '▍';
  bubble.appendChild(spanText);
  bubble.appendChild(cursor);
  stream.appendChild(bubble);

  requestAnimationFrame(() => bubble.classList.add('visible'));

  let idx = 0;
  // Sync typewriter pace to the voice duration (leaving ~15% buffer at end of phrase)
  const charDelay = Math.max(18, Math.min(65, Math.floor((typingDurationMs * 0.85) / Math.max(1, clean.length))));
  const typeTimer = setInterval(() => {
    idx += 1;
    spanText.textContent = clean.slice(0, idx);
    if (idx >= clean.length) {
      clearInterval(typeTimer);
      cursor.remove();
      const eraseTimer = setTimeout(() => removeBubbleSmoothly(bubble), holdAfterMs);
      activeDialogTimers.push(eraseTimer);
    }
  }, charDelay);
  activeDialogTimers.push(typeTimer);
}

function removeBubbleSmoothly(bubble) {
  if (!bubble || bubble.classList.contains('exiting')) return;
  bubble.classList.add('exiting');
  setTimeout(() => {
    if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
  }, 300);
}

function clearAllLateralDialogs() {
  while (activeDialogTimers.length > 0) {
    const t = activeDialogTimers.pop();
    clearTimeout(t);
    clearInterval(t);
  }
  const stream = document.getElementById('sideDialogStream');
  Array.from(stream.children).forEach((b) => removeBubbleSmoothly(b));
}

// Sequential Sentence Audio Queue synchronized with Lateral Dialogue Bubbles
async function playNextSentenceChunk() {
  if (audioQueue.length === 0) {
    isPlayingQueue = false;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'audio_playing', playing: false }));
    }
    return;
  }
  isPlayingQueue = true;
  const item = audioQueue.shift();
  applyEmotion(item.emotion);
  triggerGesture(item.gesture);

  const estimatedMs = Math.max(1600, (item.sentence || '').length * 68);

  if (!item.audio_b64) {
    playSentenceBubblesWithAudio(item.sentence, estimatedMs);
    setTimeout(playNextSentenceChunk, estimatedMs + 350);
    return;
  }

  ensureAudioGraph();
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume().catch(() => {});
  }
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'audio_playing', playing: true }));
  }

  let startedBubbles = false;
  const triggerSyncedBubbles = () => {
    if (startedBubbles) return;
    startedBubbles = true;
    const realMs =
      audioEl.duration && isFinite(audioEl.duration) && audioEl.duration > 0.2
        ? Math.round(audioEl.duration * 1000)
        : estimatedMs;
    playSentenceBubblesWithAudio(item.sentence, realMs);
  };

  audioEl.onloadedmetadata = () => triggerSyncedBubbles();
  audioEl.onended = () => {
    setTimeout(playNextSentenceChunk, 180);
  };
  audioEl.onerror = () => {
    triggerSyncedBubbles();
    setTimeout(playNextSentenceChunk, estimatedMs);
  };
  audioEl.src = `data:${item.mime || 'audio/mpeg'};base64,${item.audio_b64}`;
  audioEl.play().then(() => triggerSyncedBubbles()).catch(() => {
    triggerSyncedBubbles();
    setTimeout(playNextSentenceChunk, estimatedMs);
  });
}

window.submitQuickInput = () => {
  const inp = document.getElementById('quickInput');
  const text = inp.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  inp.value = '';
  document.getElementById('quickInputBar').style.display = 'none';
  ws.send(JSON.stringify({ type: 'user_text', text }));
};

document.getElementById('quickInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') window.submitQuickInput();
});

window.toggleQuickBar = () => {
  const bar = document.getElementById('quickInputBar');
  bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
  if (bar.style.display === 'flex') {
    document.getElementById('quickInput').focus();
  }
};

window.triggerScreenLook = () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'user_text', text: '¿Qué ves en mi pantalla ahora mismo?' }));
  }
};

window.openPanelWindow = () => {
  if (window.amadeusDesktop) {
    window.amadeusDesktop.openPanel();
  }
};

window.sendConfirm = (approved) => {
  document.getElementById('confirmCard').style.display = 'none';
  if (ws && ws.readyState === WebSocket.OPEN && pendingOpId) {
    ws.send(JSON.stringify({ type: 'confirm', id: pendingOpId, approved }));
  }
};

async function initConnection() {
  if (!window.amadeusDesktop) return;
  const info = await window.amadeusDesktop.getConnectionInfo();
  if (!info || !info.wsPort) {
    setTimeout(initConnection, 500);
    return;
  }
  httpUrl = info.httpUrl;
  loadVrmModel(`${httpUrl}/api/avatar.vrm?t=${Date.now()}`);

  ws = new WebSocket(`ws://127.0.0.1:${info.wsPort}/ws?token=${info.wsToken}`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'connected') {
      bubblesMode = msg.bubbles_mode || 'all';
    } else if (msg.type === 'reload_vrm') {
      loadVrmModel(`${httpUrl}/api/avatar.vrm?t=${Date.now()}`);
    } else if (msg.type === 'avatar_pose') {
      applyEmotion(msg.emotion);
      triggerGesture(msg.gesture);
    } else if (msg.type === 'interrupt') {
      audioQueue.length = 0;
      audioEl.pause();
      isPlayingQueue = false;
      clearAllLateralDialogs();
    } else if (msg.type === 'reply_detail') {
      if (bubblesMode !== 'off' && msg.detail) {
        // Enqueue detail lines into the sequential queue so they appear in strict order AFTER speech
        const lines = msg.detail.split(/\n+/).filter((l) => l.trim());
        lines.slice(0, 3).forEach((line) => {
          audioQueue.push({
            sentence: line,
            emotion: msg.emotion || currentEmotion,
            gesture: 'idle',
            audio_b64: '',
          });
        });
        if (!isPlayingQueue) playNextSentenceChunk();
      }
    } else if (msg.type === 'reply_chunk') {
      audioQueue.push(msg);
      if (!isPlayingQueue) playNextSentenceChunk();
    } else if (msg.type === 'confirm_request') {
      pendingOpId = msg.id;
      document.getElementById('confirmText').textContent = msg.summary;
      document.getElementById('confirmCard').style.display = 'block';
    } else if (msg.type === 'listening') {
      const pill = document.getElementById('statePill');
      if (msg.state === 'thinking') {
        pill.textContent = '✨ Pensando...';
        pill.style.display = 'block';
        triggerGesture('think');
      } else if (msg.state === 'recording') {
        pill.textContent = '🎙️ Escuchando...';
        pill.style.display = 'block';
      } else {
        pill.style.display = 'none';
      }
    }
  };

  window.amadeusDesktop.onShortcutEvent((action) => {
    if (action === 'toggle-input') {
      window.toggleQuickBar();
    } else if (action === 'look-screen') {
      window.triggerScreenLook();
    }
  });
}

initConnection();
</script>
</body>
</html>
